name: Build MaxGuard Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build MaxGuard EXE
        run: pyinstaller maxguard.spec --clean --noconfirm

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build MaxGuard Installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\MaxGuard.iss"

                            - name: Calculate SHA-256
                                shell: powershell
                                    run: |
                                       Get-ChildItem -Recurse -File |
                                           Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
                                               Get-FileHash -Algorithm SHA256 |
                                            Select-Object Path, Hash |
                                                 Out-File SHA256SUMS.txt
                                   Get-FileHash -Algorithm SHA256 |
                                   Select-Object Path, Hash |
                              Out-File SHA256SUMS.txt Out-File SHA256SUMS.txt

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MaxGuard-Windows
          path: |
            dist/**
            installer/output/**
            SHA256SUMS.txt
